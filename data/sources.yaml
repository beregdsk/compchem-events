# ---------------------------------------------------------------------------
# Candidates: checked and NOT usable as sources. Kept so nobody re-derives
# these findings. Each was checked on 2026-09-23.
#
# Psi-k forum event board — https://psi-k.net/wps-forums/events/
#   The mailing list is mirrored here, but posts are login-gated: the sitemap
#   advertises thousands of /wps_forum_subs/ URLs and every one of them
#   returns HTTP 200 serving the *homepage* to an anonymous fetch — the
#   case that justified mailbox ingestion, now live (see the `kind: mailbox`
#   entry above). The list itself moved in 2025 from this forum to JISCMail
#   (psi-k.net/important-new-psi-k-mailing-list, checked 2026-09-26, HTTP
#   200; the JISCMail subscribe page itself returns 403 to a scripted
#   fetch, so cite the announcement instead — it's what the live entry's
#   `url` points at).
#
#   JISCMail also publishes a public archive of the list itself
#   (jiscmail.ac.uk/cgi-bin/wa-jisc.exe?A1=<period>&L=PSIK-FORUM, no login) —
#   checked 2026-09-26, but it does NOT qualify as an ordinary web source:
#   the whole jiscmail.ac.uk domain sits behind a Cloudflare managed
#   challenge that returns HTTP 403 ("Just a moment...") to both a plain
#   fetch and this pipeline's own real-browser fallback
#   (browser-fetch.ts's fetchWithBrowser, the same one that gets past
#   ACS's Incapsula challenge) — it never resolved past the challenge in a
#   live test. Same class of failure as RSC and ICTP below.
#
# ICTP scientific calendar — https://www.ictp.it/home/scientific-calendar
#   www.ictp.it refuses a scripted user agent (connection closed, no status).
