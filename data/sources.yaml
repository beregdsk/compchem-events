# Sources the discovery agent watches.
#
# Read by the discovery agent (`docs/discovery-agent.md`) through
# `src/lib/discovery/sources.ts`, and checked by `npm run validate` in CI: an
# unknown field or kind, a non-https or repeated url, or a missing or
# malformed `last_checked` fails the check. It exists so the agent starts
# from a checked list instead of searching the open web on every run.
#
# Format:
#   - name: CECAM
#     url: https://www.cecam.org/program
#     kind: listing-page
#     added: 2026-09-23
#     last_checked: 2026-09-23
#     notes: One line on what the page holds and how to treat it.
#
# kind:
#   listing-page           index of many events; follow links to event pages
#   inline-listing         page listing several events as text, not links;
#                          all of them are extracted from the page itself
#   cecam-api              CECAM's program, read from the JSON API its page
#                          renders from (src/lib/discovery/cecam-client.ts)
#   event-page             one recurring event with a stable URL
#   rss                    feed; parse the feed, not the page
#   ical                   iCalendar feed; parse directly, no LLM needed
#   mailing-list-archive   public web archive of a list
#   mailbox                a list we are subscribed to, read over IMAP
#                          (see "Mailing lists" in docs/discovery-agent.md).
#                          Optional `folder:` names the IMAP folder to read;
#                          defaults to `discovery`, the one shared label/
#                          folder every list's mail filter routes into on
#                          the dedicated mailbox account (not INBOX — every
#                          `mailbox` source is meant to share this same
#                          folder, not get one each). IMAP_HOST/IMAP_USER/
#                          IMAP_PASSWORD are set on the deployment host.
#   telegram-channel       public channel; fetch the anonymous web preview at
#                          t.me/s/<channel>, not t.me/<channel> (the latter
#                          redirects to the app). No login needed. Posts are
#                          exactly as hostile as a web page or mailing-list
#                          message — same extraction pipeline, no exceptions.
#   aggregator             another site's curated list of events; links to
#                          other hosts are followed and only those official
#                          pages are extracted (never the aggregator's text)
#   group-listing          a page listing research groups; read by the groups
#                          pass, one lead per link (docs/discovery-agent.md)
#
# Rules:
#   - Every url below returned HTTP 200 and was read by a human or agent on
#     its `last_checked` date. Nothing goes in from memory (AGENTS.md rule 1).
#   - Unverified or unusable candidates live in the commented block at the
#     bottom, never as live entries.
#   - A source is a starting point, not a warrant. Everything found through
#     one is still screened against docs/curation-policy.md.
#   - Re-check `last_checked` when the agent runs; three of the URLs the
#     original spec suggested were already dead when this list was compiled.

- name: CECAM
  url: https://www.cecam.org/program?type=all&month=all&location=all
  kind: cecam-api
  added: 2026-09-23
  last_checked: 2026-09-28
  notes: >-
    The single highest-value source: flagship and node workshops, schools and
    conferences. The program page renders its list in the browser from
    members.cecam.org/api/all-events, so as a listing-page it yielded no
    event links at all; checked 2026-09-28, the API returned 29 upcoming
    events over 2 pages. Event pages are at /workshop-details/<slug> and
    carry the description but, without JavaScript, no dates — the API
    supplies those. robots.txt allows everything on both hosts.

- name: CCL conference announcements
  url: https://server.ccl.net/chemistry/announcements/conferences/index.shtml
  kind: inline-listing
  added: 2026-09-23
  last_checked: 2026-09-23
  notes: >-
    The public web face of the CCL mailing list, ordered by date as YY.MM.DD,
    one line per announcement on the page itself (inline-listing since
    2026-09-28 — it has no same-host per-event links to follow).
